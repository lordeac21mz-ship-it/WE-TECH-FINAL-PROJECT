<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WE Tech — Loja Digital</title>
<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="dark-theme">
<div id="splash" class="splash"><div class="splash-logo">WE<span>TECH</span></div><div class="splash-sub">STORE</div></div>
<div id="site" class="site hidden">
  <div class="bg-glow glow-1"></div><div class="bg-glow glow-2"></div>
  <header>
    <div class="header-top">
      <div class="brand-badge">WE TECH <span>STORE</span></div>
      <div class="header-actions">
        <button class="account-btn" onclick="openAccount()">👤 <span id="accountLabel">Minha Conta</span></button>
        <a href="/admin.html" class="admin-link">⚙️ Admin</a>
        
      </div>
    </div>
    <div class="hero"><p class="eyebrow">CATÁLOGO DIGITAL</p><h1>Explora. Escolhe. <span>Compra.</span></h1><p id="slogan">Tecnologia, jogos e entretenimento ao melhor preço.</p></div>
  </header>
  <div id="announcement" class="announcement hidden"></div>
  <nav class="category-tabs">
    <button class="tab-btn active" onclick="filter('todos',this)">✨ Todos</button>
    <button class="tab-btn" onclick="filter('jogos',this)">🎮 Jogos</button>
    <button class="tab-btn" onclick="filter('filmes',this)">🎬 Filmes</button>
    <button class="tab-btn" onclick="filter('series',this)">📺 Séries</button>
    <button class="tab-btn" onclick="filter('apps',this)">⚡ Apps</button>
  </nav>
  <main id="products" class="product-grid"></main>
  <footer><div><strong>WE TECH</strong><p id="footerSlogan"></p></div><div id="socials"></div><div id="contact"></div></footer>
</div>

<div id="account" class="overlay hidden"><div class="modal">
  <button class="close" onclick="closeAccount()">×</button>
  <div id="auth">
    <div class="tabs"><button id="loginTab" class="active" onclick="authTab('login')">Entrar</button><button id="regTab" onclick="authTab('register')">Criar conta</button></div>
    <form id="loginForm"><h2>Bem-vindo de volta 👋</h2><p class="muted">Entra para ver as tuas compras e histórico.</p><input id="email" type="email" placeholder="Email" required><input id="password" type="password" placeholder="Palavra-passe" required><button>Entrar</button><div id="loginError" class="error"></div></form>
    <form id="registerForm" class="hidden"><h2>Criar conta</h2><input id="name" placeholder="Nome completo" required><input id="regEmail" type="email" placeholder="Email" required><input id="phone" placeholder="WhatsApp / telefone"><input id="regPassword" type="password" placeholder="Palavra-passe (mín. 6)" required><button>Criar conta</button><div id="regError" class="error"></div></form>
  </div>
  <div id="clientArea" class="hidden"><div class="client-head"><div><p class="eyebrow">MINHA CONTA</p><h2>Olá, <span id="clientName"></span> 👋</h2></div><button onclick="logout()">Sair</button></div><div class="client-stats"><div><b id="purchaseCount">0</b><span>Compras</span></div><div><b id="pendingCount">0</b><span>Pendentes</span></div></div><h3>Histórico de compras</h3><div id="orders"></div></div>
</div></div>

<div id="buyModal" class="overlay hidden"><div class="modal"><button class="close" onclick="closeBuy()">×</button><div id="buyBox"></div></div></div>
<script src="app.js"></script>
</body></html>
